<!DOCTYPE html>
<html lang="ko" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보안 모의훈련 안내</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/login.css" />

  <!-- Google tag (gtag.js) -->

<body>
  <main class="page">
    <div class="card notice-card" role="dialog" aria-labelledby="notice-title">
      <section class="card__left">
        <img
          class="logo"
          src="assets/googleg_gradient_standard_48px.svg"
          alt="Google"
        />
        <h1 class="card__title" id="notice-title">보안 모의훈련 안내</h1>
        <p class="card__subtitle">정보전략팀</p>
      </section>

      <section class="card__right notice-content" aria-label="훈련 안내">
        <p class="notice-lead">
          지금까지 진행된 과정은 정보전략팀에서 실시한 해킹 모의훈련이었습니다.
        </p>
        <p>
          훈련 진행을 위해 직원들에게 사전 안내하지 않았으며, 훈련 결과는 9월
          월례회의 시간에 취합되어 공개될 예정입니다.
        </p>
        <p>
          해킹 모의훈련은 실제 사이버 공격자가 사용하는 악성 해킹 메일 유형을
          비대면·무작위로 직원들에게 발송하여, 임직원의 보안 의식을 점검하고
          사고 대응 능력을 키우는 실전형 예방 훈련입니다.
        </p>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="lang" role="button" tabindex="0">
      <span>한국어</span>
      <svg class="lang__caret" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 10l5 5 5-5z" />
      </svg>
    </div>
    <nav class="footer__links">
      <a href="#">도움말</a>
      <a href="#">개인정보처리방침</a>
      <a href="#">약관</a>
    </nav>
  </footer>

  <script type="module" src="js/firebase-log.js"></script>
  <script src="js/auth.js"></script>

    initNoticeScreen();
  </script>
